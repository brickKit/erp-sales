openapi: 3.0.3
info:
  title: erp-sales · 销售管理
  version: 1.0.0
  description: |
    对外 REST 面（组件之间走 gRPC）。
    不暴露 BatchGetOrder/GetOrderStatus：前者是给其他组件 gRPC 客户端
    防 N+1 用的批量读，后者是组件间协议（调用方超时之后先查状态再决定）。
    CalculatePriceDryRun 必须暴露：前端下单页要实时试算，前端/BFF
    不许自己算钱。
    列表与统计都按调用者的数据范围过滤：org（dept_path 前缀）或 owner
    （owner_id 等于调用者），由 view 参数二选一。单张订单（查看、确认、
    取消、发货）两者任一命中即可。没有部门的调用者 org 维什么都不命中，
    只看得到、动得了自己名下的订单；他建的单 dept_path / dept_id 为空串，
    只对他本人可见。

servers:
  - url: /erp/sales

# /healthz 不在这份契约里：be-sdk-go 的 NewGinEngine 给每个组件统一挂，
# 路径固定是裸根路径 /healthz。

paths:
  /orders:
    get:
      summary: ListOrders
      operationId: listSalesOrders
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: 游标分页，没有 offset 参数——深分页在契约层面不可表达
        - name: page_size
          in: query
          schema: { type: integer }
        - name: customer_id
          in: query
          schema: { type: string }
        - name: status_filter
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
          description: 不传时间范围时默认最近 90 天；格式不是 RFC 3339 时返回 400
        - name: source_opportunity_id
          in: query
          schema: { type: string }
          description: 非空时只返回由这张商机赢单转成的订单（商机详情页反查订单用）
        - name: view
          in: query
          schema: { type: string, enum: [dept, mine] }
          description: |
            数据范围视角，二选一。dept（默认）：调用者部门及下级（dept_path 前缀）；mine：owner_id 等于调用者。
            其它取值返回 400。没有部门的调用者（token 的 dept_path 为空）dept 视图是空列表；
            dept_path 为 "/" 是整棵部门树的根标记，看得到所有带部门的订单
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  next_cursor: { type: string }
        "400":
          description: view 不是 dept / mine，cursor 非法，或 created_after / created_before 不是 RFC 3339 时间
    post:
      summary: CreateOrder（建 DRAFT，不预留库存）
      operationId: createSalesOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /orders/{id}:
    get:
      summary: GetOrder
      operationId: getSalesOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          description: 订单不存在，或不在调用者的数据范围内（两种情况答得一模一样，不泄露订单是否存在）

  /orders/{id}/confirm:
    post:
      summary: ConfirmOrder（校验客户与产品、本地信用额度预判、预留库存、确认并发事件；失败时补偿）
      operationId: confirmSalesOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdempotentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403":
          description: 订单不在调用者的数据范围内（看得到才动得了）
        "404":
          description: 订单不存在

  /orders/{id}/cancel:
    post:
      summary: CancelOrder（释放预留、发事件）
      operationId: cancelSalesOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelOrderRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403":
          description: 订单不在调用者的数据范围内（看得到才动得了）
        "404":
          description: 订单不存在

  /orders/{id}/ship:
    post:
      summary: ShipOrder（预留转实际出库）
      operationId: shipSalesOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdempotentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403":
          description: 订单不在调用者的数据范围内（看得到才动得了）
        "404":
          description: 订单不存在

  /price/dry-run:
    post:
      summary: CalculatePriceDryRun（纯函数不落库，前端下单页实时试算）
      operationId: calculateSalesPriceDryRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalculatePriceDryRunRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalculatePriceDryRunResponse" }

  /stats/summary:
    get:
      summary: StatsSummary（仪表盘：窗口期内建的订单数、已确认数与金额，按日、按状态分布）
      operationId: getSalesStatsSummary
      description: |
        只统计调用者数据范围内的订单，范围与 GET /orders 完全一致（view 二选一）。
        窗口是最近 7 / 30 / 90 个自然日（UTC，含今天），按订单的 created_at 归日。
        order_count 数窗口内建的全部订单；confirmed_count 与 total_amount 只算
        已确认（CONFIRMED / SHIPPED / COMPLETED）的订单。
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [week, month, quarter], default: month }
          description: week = 7 天，month = 30 天，quarter = 90 天；其它取值返回 400
        - name: view
          in: query
          schema: { type: string, enum: [dept, mine] }
          description: |
            同 GET /orders 的 view，二选一，不是 OR。dept（默认）：调用者部门及下级；mine：owner_id 等于调用者。
            其它取值返回 400。没有部门的调用者 dept 视图的各项统计都是 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsSummary" }
        "400":
          description: period 不是 week / month / quarter，或 view 不是 dept / mine

components:
  schemas:
    OrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, SHIPPED, COMPLETED, CANCELLED, CLOSED, SUSPENDED]

    OrderItem:
      type: object
      properties:
        product_id: { type: string }
        product_sku: { type: string }
        product_name: { type: string }
        uom_id: { type: string }
        qty: { type: string, description: decimal-as-string }
        unit_price:
          type: string
          description: 金额一律用 string 传 decimal，绝不用 double（跨语言精度）
        discount: { type: string, description: "0~1 的小数，如 0.10 表示九折" }
        tax_rate: { type: string }
        subtotal:
          type: string
          description: 服务端算好直接给，不让调用方自己算

    Order:
      type: object
      properties:
        id: { type: string }
        order_no: { type: string }
        customer_id: { type: string }
        customer_name: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        total_amount: { type: string }
        dept_id: { type: string, description: 建单时的快照；建单人没有部门时为空串 }
        dept_path: { type: string, description: 建单时的快照（以 / 开头的部门路径）；建单人没有部门时为空串，这张单只对 owner 可见 }
        owner_id: { type: string }
        reservation_id: { type: string }
        source_opportunity_id:
          type: string
          description: 由哪张商机赢单自动转成的订单；空串表示手工建单。只由赢单消费路径写入，建单请求不接受这个字段
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IdempotentRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key:
          type: string
          description: 跨重试幂等键，被调用方用唯一约束去重

    CreateOrderItemInput:
      type: object
      required: [product_id, qty]
      properties:
        product_id: { type: string }
        qty: { type: string }

    CreateOrderRequest:
      type: object
      required: [idempotency_key, customer_id, items]
      properties:
        idempotency_key: { type: string }
        customer_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CreateOrderItemInput" }

    CancelOrderRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string }
        reason: { type: string }

    PriceDryRunItem:
      type: object
      required: [product_id, qty]
      properties:
        product_id: { type: string }
        qty: { type: string }

    CalculatePriceDryRunRequest:
      type: object
      required: [customer_id, items]
      properties:
        customer_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/PriceDryRunItem" }

    PriceDryRunResultItem:
      type: object
      properties:
        product_id: { type: string }
        unit_price: { type: string }
        discount: { type: string }
        tax_rate: { type: string }
        subtotal: { type: string }

    CalculatePriceDryRunResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PriceDryRunResultItem" }
        total_amount: { type: string }

    StatsDay:
      type: object
      properties:
        date: { type: string, format: date, description: "YYYY-MM-DD（UTC）" }
        order_count: { type: integer }
        total_amount: { type: string, description: 当天建的、已确认订单的金额合计（decimal-as-string） }

    StatsSummary:
      type: object
      properties:
        period: { type: string, enum: [week, month, quarter] }
        from: { type: string, format: date, description: 窗口第一天（含） }
        to: { type: string, format: date, description: 窗口最后一天（今天，含） }
        order_count: { type: integer }
        confirmed_count: { type: integer }
        total_amount: { type: string, description: 已确认订单的金额合计（decimal-as-string） }
        by_day:
          type: array
          description: 窗口内每一天一项，没有订单的日子也有（0 / "0.00"）
          items: { $ref: "#/components/schemas/StatsDay" }
        by_status:
          type: object
          description: 全部 7 个状态都列出，没有订单的是 0
          additionalProperties: { type: integer }
