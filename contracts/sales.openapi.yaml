openapi: 3.0.3
info:
  title: erp-sales · 销售管理
  version: 1.0.0
  description: |
    对外 REST 面。内部 gRPC，外部 HTTP（§2.1）。
    ⚠️ 不暴露 BatchGetOrder/GetOrderStatus——前者是给其他组件 gRPC 客户端
    防 N+1 用的批量读优化，后者是组件间协议（防"薛定谔的超时"，设计计划
    §3、§4.5）。
    CalculatePriceDryRun **必须**暴露——前端下单页要实时试算，前端/BFF
    严禁自己算钱（设计计划 §3.2、§8.4）。

servers:
  - url: /erp/sales

# ⚠️ /healthz 不在这份契约里：be-sdk-go 的 NewGinEngine 给每个组件统一挂的，
# 路径固定是裸根路径 /healthz（§12.3.6）。

paths:
  /orders:
    get:
      summary: ListOrders
      operationId: listSalesOrders
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
          description: 游标分页（决策 53），无 offset 参数——深分页在契约层面不可表达
        - name: page_size
          in: query
          schema: { type: integer }
        - name: customer_id
          in: query
          schema: { type: string }
        - name: status_filter
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
          description: 不传时间范围时框架层自动注入最近 90 天（§11.4.1）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  next_cursor: { type: string }
    post:
      summary: CreateOrder（建 DRAFT，不预留库存）
      operationId: createSalesOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /orders/{id}:
    get:
      summary: GetOrder
      operationId: getSalesOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /orders/{id}/confirm:
    post:
      summary: ConfirmOrder（TCC 链：校验+预留+建单，见设计计划 §3.1）
      operationId: confirmSalesOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdempotentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /orders/{id}/cancel:
    post:
      summary: CancelOrder（释放预留、发事件）
      operationId: cancelSalesOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelOrderRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /orders/{id}/ship:
    post:
      summary: ShipOrder（预留转实际出库）
      operationId: shipSalesOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdempotentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /price/dry-run:
    post:
      summary: CalculatePriceDryRun（纯函数不落库，前端下单页实时试算）
      operationId: calculateSalesPriceDryRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalculatePriceDryRunRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalculatePriceDryRunResponse" }

components:
  schemas:
    OrderStatus:
      type: string
      enum: [DRAFT, CONFIRMED, SHIPPED, COMPLETED, CANCELLED, CLOSED, SUSPENDED]

    OrderItem:
      type: object
      properties:
        product_id: { type: string }
        product_sku: { type: string }
        product_name: { type: string }
        uom_id: { type: string }
        qty: { type: string, description: decimal-as-string }
        unit_price:
          type: string
          description: 金额一律用 string 传 decimal，绝不用 double（跨语言精度）
        discount: { type: string, description: "0~1 的小数，如 0.10 表示九折" }
        tax_rate: { type: string }
        subtotal:
          type: string
          description: 服务端算好直接给，不让调用方自己算

    Order:
      type: object
      properties:
        id: { type: string }
        order_no: { type: string }
        customer_id: { type: string }
        customer_name: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        total_amount: { type: string }
        dept_id: { type: string }
        dept_path: { type: string }
        owner_id: { type: string }
        reservation_id: { type: string }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    IdempotentRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key:
          type: string
          description: 跨重试幂等键（§4.6），被调用方用唯一约束去重

    CreateOrderItemInput:
      type: object
      required: [product_id, qty]
      properties:
        product_id: { type: string }
        qty: { type: string }

    CreateOrderRequest:
      type: object
      required: [idempotency_key, customer_id, items]
      properties:
        idempotency_key: { type: string }
        customer_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CreateOrderItemInput" }

    CancelOrderRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key: { type: string }
        reason: { type: string }

    PriceDryRunItem:
      type: object
      required: [product_id, qty]
      properties:
        product_id: { type: string }
        qty: { type: string }

    CalculatePriceDryRunRequest:
      type: object
      required: [customer_id, items]
      properties:
        customer_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/PriceDryRunItem" }

    PriceDryRunResultItem:
      type: object
      properties:
        product_id: { type: string }
        unit_price: { type: string }
        discount: { type: string }
        tax_rate: { type: string }
        subtotal: { type: string }

    CalculatePriceDryRunResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PriceDryRunResultItem" }
        total_amount: { type: string }
