// ⚠️ 只读镜像，不是本组件的契约。这是 erp-finance 仓库
// contracts/erp/finance/v1/finance.proto 的逐字复制，供本组件本地
// buf generate 出 gRPC 客户端 stub 用——同 vendor/mdm/customer 的判据，
// 见 docs/design/erp-sales.md §9。严禁手改这份文件的业务字段。

syntax = "proto3";

package erp.finance.v1;

option go_package = "github.com/brickKit/erp-sales/gen/erp/finance/v1;financev1";

import "google/protobuf/timestamp.proto";

// 财务服务。本组件是三枢纽之一的事件汇枢纽（设计计划 §1、§2.6）——
// 别人发生的事，在这里变成会计语言。没有出边：dependencies.components
// 永远是空数组（设计计划 §5）。凭证只消费事件生成，不接受外部同步调用
// 建凭证——PostManualEntry 是唯一的例外（人工补录）。
service FinanceService {
  // ── 会计期间：CheckPeriodOpen 只是咨询性的，不是权威判定 ──
  // （设计计划 §3.1：权威判定发生在本组件过账事务内部，不可绕过）。
  rpc CheckPeriodOpen(CheckPeriodOpenRequest) returns (CheckPeriodOpenResponse);
  rpc ClosePeriod    (ClosePeriodRequest)     returns (ClosePeriodResponse);
  rpc ReopenPeriod   (ReopenPeriodRequest)    returns (ReopenPeriodResponse);
  rpc LockPeriod     (LockPeriodRequest)      returns (LockPeriodResponse);

  // ── 信用额度：本组件持有"已用额度"，额度值本身在 mdm-customer ──
  rpc GetCreditExposure(GetCreditExposureRequest) returns (CreditExposure);
  // BatchGetCreditExposure 是防 N+1 的唯一合法调用方式（§3.8）。
  rpc BatchGetCreditExposure(BatchGetCreditExposureRequest) returns (BatchGetCreditExposureResponse);

  // ── 凭证：自动凭证走事件消费，这里只有人工补录与冲销 ──
  rpc PostManualEntry(PostManualEntryRequest) returns (PostManualEntryResponse);
  // ReverseEntry 是红字冲销，不是删除（设计计划 §2.1）：原凭证一个字
  // 不动，产生一张新的反向凭证。
  rpc ReverseEntry(ReverseEntryRequest) returns (ReverseEntryResponse);

  // ── 读 ──
  rpc GetEntry     (GetEntryRequest)      returns (JournalEntry);
  rpc ListEntries  (ListEntriesRequest)   returns (ListEntriesResponse);
  rpc ListARLedger (ListARLedgerRequest)  returns (ListARLedgerResponse);
}

// ⚠️ 三态，不是布尔：CLOSED 是可逆的日常操作，LOCKED 是不可逆的年度
// 操作（设计计划 §2.2）。OPEN -close-> CLOSED -lock-> LOCKED（终态）；
// CLOSED -reopen-> OPEN。
enum PeriodStatus {
  PERIOD_STATUS_UNSPECIFIED = 0; // 这个期间不存在
  PERIOD_STATUS_OPEN        = 1;
  PERIOD_STATUS_CLOSED      = 2;
  PERIOD_STATUS_LOCKED      = 3;
}

// ⚠️ 只有两态，没有 CANCELLED（设计计划 §2.1：查证 Tryton/Odoo/ERPNext
// 三家都是"cancel 从来不是 delete"，撤销本身也是一笔要留痕的新凭证）。
enum EntryStatus {
  ENTRY_STATUS_UNSPECIFIED = 0;
  ENTRY_STATUS_DRAFT       = 1;
  ENTRY_STATUS_POSTED      = 2;
}

message CheckPeriodOpenRequest {
  string period          = 1; // 格式 "YYYY-MM"
  string legal_entity_id = 2;
}
message CheckPeriodOpenResponse {
  PeriodStatus status = 1;
}

message ClosePeriodRequest {
  string idempotency_key = 1;
  string period          = 2;
  string legal_entity_id = 3;
}
message ClosePeriodResponse { PeriodStatus status = 1; }

message ReopenPeriodRequest {
  string idempotency_key = 1;
  string period          = 2;
  string legal_entity_id = 3;
}
message ReopenPeriodResponse { PeriodStatus status = 1; }

message LockPeriodRequest {
  string idempotency_key = 1;
  string period          = 2;
  string legal_entity_id = 3;
}
message LockPeriodResponse { PeriodStatus status = 1; }

// CreditExposure：已用额度，不是额度值本身（额度值在 mdm-customer，
// 设计计划 §5 的三方分工）。
message CreditExposure {
  string customer_id = 1;
  string exposure     = 2; // decimal-as-string，一律不用 double
  int64  version       = 3;
}

message GetCreditExposureRequest { string customer_id = 1; }

message BatchGetCreditExposureRequest { repeated string customer_ids = 1; }
message BatchGetCreditExposureResponse {
  // 只返回找到的；缺失的客户视为已用额度 0（同 erp-inventory 的
  // BatchGetBalance 判据）。
  repeated CreditExposure exposures = 1;
}

// JournalEntryLine：分录行，debit/credit 恰好一个非零（会计复式记账）。
message JournalEntryLine {
  string account_id = 1;
  string debit       = 2; // decimal-as-string
  string credit      = 3; // decimal-as-string
  string memo        = 4;
}

// JournalEntry：凭证头 + 行。⚠️ post_no 只有过账（POSTED）后才有值，
// entry_no 创建（DRAFT）时就分配——两个单号分开是刻意的（设计计划 §2.1：
// entry_no 允许有缺口，post_no 同一期间内必须连续无缺口）。
message JournalEntry {
  string   id               = 1;
  string   entry_no         = 2;
  string   post_no          = 3; // 空字符串表示还未过账
  string   period            = 4; // "YYYY-MM"
  string   legal_entity_id   = 5;
  EntryStatus status         = 6;
  // 幂等过账的唯一约束落在这四个字段上（设计计划 §2.3），只对自动
  // 凭证（消费事件生成的）有意义，人工凭证（PostManualEntry）留空。
  string   source_component  = 7;
  string   source_doc_type   = 8;
  string   source_doc_id     = 9;
  int64    source_revision   = 10;
  repeated JournalEntryLine lines = 11;
  string   memo              = 12;
  int64    version            = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp posted_at  = 15;
}

message PostManualEntryRequest {
  string idempotency_key            = 1;
  string legal_entity_id            = 2;
  repeated JournalEntryLine lines    = 3;
  string memo                        = 4;
}
message PostManualEntryResponse { JournalEntry entry = 1; }

message ReverseEntryRequest {
  string idempotency_key = 1;
  string entry_id         = 2;
  string reason           = 3;
}
// entry 是新产生的反向凭证，不是原凭证——原凭证一个字不动（设计计划 §2.1）。
message ReverseEntryResponse { JournalEntry entry = 1; }

message GetEntryRequest { string id = 1; }

message ListEntriesRequest {
  // ⚠️ 禁止深 Offset，强制 Cursor Pagination（决策 53）
  string cursor          = 1;
  int32  page_size        = 2;
  string period           = 3;
  EntryStatus status_filter = 4;
  google.protobuf.Timestamp created_after  = 5;
  google.protobuf.Timestamp created_before = 6;
}
message ListEntriesResponse {
  repeated JournalEntry entries = 1;
  string   next_cursor           = 2;
}

// ARLedgerEntry：应收台账一行，与总账分家（设计计划 §2.4）——可变，
// 核销状态挂在这里，不去改已经归档的总账分区。
message ARLedgerEntry {
  string id                = 1;
  string customer_id        = 2;
  string entry_id           = 3; // 来源的 JournalEntry.id
  string amount              = 4; // decimal-as-string
  string reconciled_amount   = 5; // decimal-as-string，已核销部分
  google.protobuf.Timestamp created_at = 6;
}

message ListARLedgerRequest {
  string cursor          = 1;
  int32  page_size        = 2;
  string customer_id      = 3;
  google.protobuf.Timestamp created_after  = 4;
  google.protobuf.Timestamp created_before = 5;
}
message ListARLedgerResponse {
  repeated ARLedgerEntry entries = 1;
  string   next_cursor            = 2;
}
