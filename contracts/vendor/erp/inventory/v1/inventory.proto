// ⚠️ 只读镜像，不是本组件的契约。这是 erp-inventory 仓库
// contracts/erp/inventory/v1/inventory.proto 的逐字复制，供本组件本地
// buf generate 出 gRPC 客户端 stub 用——同 vendor/mdm/customer 的判据，
// 见 docs/design/erp-sales.md §9。严禁手改这份文件的业务字段。

syntax = "proto3";

package erp.inventory.v1;

option go_package = "github.com/brickKit/erp-sales/gen/erp/inventory/v1;inventoryv1";

import "google/protobuf/timestamp.proto";

// 库存服务。本组件是三枢纽之一的物理命令枢纽（设计计划 §1、§2.6）——
// "这批货现在还有没有、能不能占"这个问题的唯一真相源。没有出边：
// dependencies.components 永远是空数组（设计计划 §5）。
service InventoryService {
  // ── TCC 三件套 + 状态查询：跨组件写接口，erp-sales 建单的第一步 ──
  // ⚠️ 这四个 rpc 永远不暴露到 REST——它们是组件间 TCC 协议的一部分，
  // 不是人类操作（设计计划 §3）。
  rpc Reserve            (ReserveRequest)            returns (ReserveResponse);
  rpc CancelReservation  (CancelReservationRequest)  returns (CancelReservationResponse);
  rpc ConfirmIssue       (ConfirmIssueRequest)       returns (ConfirmIssueResponse);
  // GetReservationStatus 是防"薛定谔的超时"的唯一手段，不是可选项
  // （设计计划 §4.5）。上游超时后必须先查真实状态再决定要不要 Cancel——
  // 直接猜会导致误杀（取消了其实成功的预留）或漏杀（漏掉其实失败的）。
  rpc GetReservationStatus(GetReservationStatusRequest) returns (GetReservationStatusResponse);

  // ── 命令：入库 / 调整 ──
  rpc Receive (ReceiveRequest) returns (ReceiveResponse);
  rpc Adjust  (AdjustRequest)  returns (AdjustResponse);

  // ── 读 ──
  rpc GetBalance     (GetBalanceRequest)     returns (Balance);
  // BatchGetBalance 是防 N+1 的唯一合法调用方式（§3.8）——下单页面一次
  // 查一整单的可用量。任何时候都不许删掉它只留 GetBalance。
  rpc BatchGetBalance(BatchGetBalanceRequest) returns (BatchGetBalanceResponse);
  // 游标分页 + 强制时间窗口（§11.4.1、决策 53），不给 offset 参数
  rpc ListMovements  (ListMovementsRequest)  returns (ListMovementsResponse);
}

// ⚠️ NOT_FOUND 与 CANCELLED 必须能区分——见 GetReservationStatusResponse 的注释。
enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_RESERVED    = 1;   // 未决，占着但还没转实际出库
  RESERVATION_STATUS_CONFIRMED   = 2;   // 终态：已 ConfirmIssue
  RESERVATION_STATUS_CANCELLED   = 3;   // 终态：已撤销
}

enum MovementReason {
  MOVEMENT_REASON_UNSPECIFIED = 0;
  MOVEMENT_REASON_RECEIVE     = 1;   // 入库
  MOVEMENT_REASON_ISSUE       = 2;   // 出库（ConfirmIssue 产生）
  MOVEMENT_REASON_ADJUST_GAIN = 3;   // 盘盈
  MOVEMENT_REASON_ADJUST_LOSS = 4;   // 盘亏
}

message ReserveItem {
  string product_id   = 1;   // 不透明外键——本组件不校验产品是否存在（设计计划 §5）
  string warehouse_id = 2;
  string qty          = 3;   // decimal-as-string
}

message ReserveRequest {
  // ⚠️ 所有跨组件写操作接口必须基于业务单号实现严格幂等（§4.6）
  string idempotency_key = 1;
  string order_id        = 2;   // 仅作幂等键与追溯字段，不参与任何判断逻辑（设计计划 §1）
  repeated ReserveItem items = 3;
}
message ReserveResponse {
  string reservation_id = 1;
}

message CancelReservationRequest {
  string idempotency_key = 1;
  string reservation_id  = 2;
}
message CancelReservationResponse {
  ReservationStatus status = 1;
}

message ConfirmIssueRequest {
  string idempotency_key = 1;
  string reservation_id  = 2;
  // 批次号/序列号：一次 Reserve 调用可以有多个 (product, warehouse) 项
  // （见 ReserveRequest.items），这里的 batch_no/serial_no 对该 reservation
  // 下的所有项统一生效。⚠️ 这是刻意的简化，不是疏漏——一次预留里有
  // 多个需要各自不同批次/序列号的项，是"一个 Reserve 调用管一整张单"这个
  // 设计与"批次号是单据行级信息"之间的真实张力：本阶段的解法是调用方
  // （erp-sales）对需要各自独立批次/序列号的行分别发起 Reserve/ConfirmIssue，
  // 不要把它们塞进同一个 reservation_id（设计计划 §9 待决问题记录了这条）。
  string batch_no  = 3;
  string serial_no = 4;
}
message ConfirmIssueResponse {
  ReservationStatus status = 1;
  // 一次 ConfirmIssue 会把 reservation_id 下的每一项各转成一条流水，
  // 所以是 repeated——用单个 movement_id 装不下多项确认产生的多条流水。
  repeated string movement_ids = 2;
}

message GetReservationStatusRequest {
  // 二选一：正常情况下调用方（如 erp-sales）手里有 Reserve 成功返回的
  // reservation_id，直接查。⚠️ 但 Reserve 本身超时（响应没收到，不代表
  // 请求没处理）时调用方根本不知道 reservation_id——这种情况下用
  // idempotency_key（Reserve 请求里发的那个）查：本组件的 Reserve 走
  // claim-first 幂等，command_idempotency 表里 idempotency_key →
  // reservation_id 的映射只在 Reserve 事务**提交后**才对其他事务可见，
  // 所以"按 idempotency_key 查到" 与 "Reserve 已提交" 完全等价；查不到
  // 就是真正的 NOT_FOUND（提交尚未发生或从未发生），可以安全重试 Reserve
  // ——claim-first 保证重试不会产生重复预留。reservation_id 非空时优先
  // 用 reservation_id（v1.0.0 起就有的路径不变）；为空时才退回
  // idempotency_key。两个都为空是入参错误。
  //
  // 这个字段是本阶段 Task 17（erp-sales 第一次真实实现 TCC 补偿链）时
  // 发现的契约缺口：v1.0.0 只支持按 reservation_id 查，但"Reserve 超时"
  // 这个最需要查状态的场景恰恰是调用方唯一拿不到 reservation_id 的场景。
  // 详见 docs/design/erp-inventory.md §9、docs/design/erp-sales.md §9。
  string reservation_id  = 1;
  string idempotency_key = 2;
}
message GetReservationStatusResponse {
  // ⚠️ RESERVATION_STATUS_UNSPECIFIED 在这里就是 NOT_FOUND 的信号——
  // "请求根本没到"（可以安全重试），与 CANCELLED"到了且已撤销"
  // （不能重试）必须能区分，绝不许合并成一个"没有"（设计计划 §3、§4.5）。
  ReservationStatus status = 1;
  string order_id          = 2;
  // ⚠️ 与 idempotency_key 字段同批追加（设计计划 §9 第 9 条）：调用方按
  // idempotency_key 查到 RESERVED 后，必须把**真正的** reservation_id
  // 存下来（后续 CancelOrder/ShipOrder 要用它调 CancelReservation/
  // ConfirmIssue）——v1.0.1 只加了 GetReservationStatusRequest 的
  // idempotency_key 字段，却忘了让 Response 把解析出来的 reservation_id
  // 带回去，调用方查到状态却还是拿不到 id，等于没解决问题。空字符串表示
  // NOT_FOUND（与 status 的 UNSPECIFIED 同一个语义）。
  string reservation_id    = 3;
}

message ReceiveRequest {
  string idempotency_key = 1;
  string product_id      = 2;
  string warehouse_id    = 3;
  string qty             = 4;
  string batch_no        = 5;
  string serial_no       = 6;
}
message ReceiveResponse {
  string movement_id = 1;
}

message AdjustRequest {
  string idempotency_key = 1;
  string product_id      = 2;
  string warehouse_id    = 3;
  // qty_delta 带符号：正为盘盈，负为盘亏
  string qty_delta       = 4;
  string reason          = 5;   // 人类可读的调整原因，阶段二不接审批（设计计划 §9 第 4 条）
}
message AdjustResponse {
  string movement_id = 1;
}

message Balance {
  string product_id    = 1;
  string warehouse_id  = 2;
  string on_hand_qty   = 3;
  string reserved_qty  = 4;
  string available_qty = 5;   // on_hand_qty - reserved_qty，服务端算好直接给，不让调用方自己减
  int64  version        = 6;
}

message GetBalanceRequest {
  string product_id   = 1;
  string warehouse_id = 2;
}

message BalanceKey {
  string product_id   = 1;
  string warehouse_id = 2;
}
message BatchGetBalanceRequest {
  repeated BalanceKey keys = 1;
}
message BatchGetBalanceResponse {
  // 只返回找到的（余额行不存在等价于全 0，调用方按缺失自行判断为 0，
  // 与 mdm-product 的 BatchGet missing_ids 风格保持一致）
  repeated Balance balances = 1;
}

message Movement {
  string         id            = 1;
  string         product_id    = 2;
  string         warehouse_id  = 3;
  string         qty           = 4;   // 带符号
  MovementReason reason        = 5;
  string         order_id      = 6;
  string         batch_no      = 7;
  string         serial_no     = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListMovementsRequest {
  // ⚠️ 禁止深 Offset，强制 Cursor Pagination（决策 53）
  string cursor      = 1;
  int32  page_size   = 2;
  string product_id   = 3;
  string warehouse_id = 4;
  google.protobuf.Timestamp created_after  = 5;
  google.protobuf.Timestamp created_before = 6;   // 不传时框架层自动注入最近 90 天（§11.4.1）
}
message ListMovementsResponse {
  repeated Movement movements  = 1;
  string            next_cursor = 2;
}
