// ⚠️ 只读镜像，不是本组件的契约。这是 mdm-product 仓库
// contracts/mdm/product/v1/product.proto 的逐字复制，供本组件本地
// buf generate 出 gRPC 客户端 stub 用——同 vendor/mdm/customer 的判据，
// 见 docs/design/erp-sales.md §9。严禁手改这份文件的业务字段。

syntax = "proto3";

package mdm.product.v1;

option go_package = "github.com/brickKit/erp-sales/gen/mdm/product/v1;productv1";

import "google/protobuf/timestamp.proto";

// 产品/物料主数据服务。mdm 是只读枢纽：被所有人读、自己不调任何人（§2.6）
service ProductService {
  // ── 命令 ──
  rpc Create   (CreateRequest)   returns (CreateResponse);
  rpc Update   (UpdateRequest)   returns (UpdateResponse);
  rpc SetStatus(SetStatusRequest) returns (SetStatusResponse);

  // ── 读 ──
  rpc Get       (GetRequest)       returns (Product);
  rpc List      (ListRequest)      returns (ListResponse);
  // BatchGet 是 BFF 与 erp-sales 防 N+1 的唯一合法调用方式（§3.8）。
  // 每个聚合根都必须提供它——没有它，Resolver/erp-sales 建单只能退化成
  // 循环调 Get 的瀑布流。
  rpc BatchGet  (BatchGetRequest)  returns (BatchGetResponse);
  // GetSummary 返回摘要副本用的那几个字段。下游只存外键 + 摘要（§3.8）
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);

  // ConvertQuantity 是纯函数，不落库——"买箱卖个"这类跨单位换算。
  // 前端下单页面要实时试算，必须走这个后端 DryRun 接口，不许自己算
  // （设计书 §8.4）。
  rpc ConvertQuantity(ConvertQuantityRequest) returns (ConvertQuantityResponse);
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_ACTIVE      = 1;
  // ⚠️ 不是终态：历史订单/库存流水仍引用这条产品记录，不存在可判定
  // "无活跃业务"然后归档的时刻（设计计划 §7）。
  PRODUCT_STATUS_DISABLED    = 2;
}

// ⚠️ 挂在产品上而不是挂在批次上——追踪策略是产品的属性（借鉴 Odoo
// product.tracking 这个位置，设计计划 §8）
enum TrackingType {
  TRACKING_TYPE_UNSPECIFIED = 0;
  TRACKING_TYPE_NONE        = 1;
  TRACKING_TYPE_BATCH       = 2;
  TRACKING_TYPE_SERIAL      = 3;
}

message Product {
  string   id            = 1;
  string   sku           = 2;   // 业务编号，唯一
  string   name          = 3;
  string   category_id   = 4;
  string   base_uom_id   = 5;   // 基本计量单位
  TrackingType tracking_type = 6;
  string   standard_cost = 7;   // ⚠️ 金额一律用 string 传 decimal，绝不用 double
  ProductStatus status   = 8;
  int64    version       = 9;   // 消费侧靠它做状态单向演进校验（§3.10）
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// 摘要副本：外键 + name / status / version（§附录 I「摘要副本」）
message ProductSummary {
  string id      = 1;
  string sku     = 2;
  string name    = 3;
  string base_uom_id = 4;
  TrackingType tracking_type = 5;
  ProductStatus status = 6;
  int64  version = 7;
}

message CreateRequest {
  // ⚠️ 所有跨组件写操作接口必须基于业务单号实现严格幂等（§4.6）。
  string idempotency_key = 1;
  // sku 可选：留空则按 "P" + 6 位自增数字生成；显式传入则校验唯一后使用
  string sku           = 2;
  string name          = 3;
  string category_id   = 4;
  string base_uom_id   = 5;
  TrackingType tracking_type = 6;
  string standard_cost = 7;
}
message CreateResponse { Product product = 1; }

message UpdateRequest {
  string idempotency_key = 1;
  string id             = 2;
  int64  version        = 3;   // 乐观锁：与库里不一致则拒绝
  string name           = 4;
  string category_id    = 5;
  string standard_cost  = 6;
}
message UpdateResponse { Product product = 1; }

message SetStatusRequest {
  string idempotency_key = 1;
  string id      = 2;
  int64  version = 3;
  ProductStatus status = 4;
}
message SetStatusResponse { Product product = 1; }

message GetRequest { string id = 1; }

message ListRequest {
  // ⚠️ 禁止深 Offset，强制 Cursor Pagination（决策 53）。
  string cursor    = 1;
  int32  page_size = 2;
  ProductStatus status_filter = 3;
  google.protobuf.Timestamp created_after  = 4;
  google.protobuf.Timestamp created_before = 5;
}
message ListResponse {
  repeated Product products    = 1;
  string          next_cursor  = 2;
}

message BatchGetRequest  { repeated string ids = 1; }
message BatchGetResponse {
  // 只返回找到的。缺失的 id 不报错——由调用方自己判断
  repeated Product products = 1;
  repeated string missing_ids = 2;
}

message GetSummaryRequest  { repeated string ids = 1; }
message GetSummaryResponse { repeated ProductSummary summaries = 1; }

message ConvertQuantityRequest {
  string product_id = 1;
  string qty        = 2;   // decimal-as-string，同金额字段的理由
  string from_uom_id = 3;
  string to_uom_id   = 4;
}
message ConvertQuantityResponse {
  string qty = 1;   // 已按目标单位的 rounding 向上取整（CEIL，设计计划 §2.1）
}
