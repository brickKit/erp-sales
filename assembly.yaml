id: erp/sales                        # 必须与 component.yaml 一致，be-ops 校验

domain: erp
tier: backend

edge_routes:
  - { path: /erp/sales/**, auth: required }

menus:
  - { key: erp.sales, title: 销售管理, permission: erp.sales.view }

data:
  schema: erp_sales                   # registry/schemas.tsv
  role:   erp_sales_rw                # 登录角色，`PG_USER` 的值

data_scopes:
  - { dimension: org,   column: dept_path, mode: prefix, tables: [sales_orders] }
  - { dimension: owner, column: owner_id,  mode: equals, tables: [sales_orders] }

permissions:
  - { key: erp.sales.view,    title: 查看销售订单, type: page   }
  - { key: erp.sales.create,  title: 建立报价/订单, type: action }
  - { key: erp.sales.confirm, title: 确认订单,     type: action }
  - { key: erp.sales.cancel,  title: 取消订单,     type: action }
  - { key: erp.sales.ship,    title: 发货,         type: action }
