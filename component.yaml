apiVersion: brickkit/v1
kind: Component

metadata:
  id: erp/sales
  name: Sales
  version: 2.0.0
  description: Sales quotations and the order lifecycle, pricing, and the compensating orchestration that reserves stock when an order is confirmed.
  repository: https://github.com/brickKit/erp-sales
  license: Apache-2.0
  vendor: brickKit

tags: [erp, sales, order]

artifacts:
  - type: api-contract
    format: protobuf
    files: [contracts/erp/sales/v1/sales.proto, contracts/events/sales.events.json]
  - type: api-contract
    format: openapi
    files: [contracts/sales.openapi.yaml]
  - type: metadata
    files: [assembly.yaml]

dependencies:
  components:
    - mdm/customer@2.0.1
    - mdm/product@2.0.0
    - erp/inventory@2.0.0
    - id: infra/workflow@2.0.1
      optional: true

configSchema:
  type: object
  properties:
    PG_HOST: {type: string}
    PG_PORT: {type: string, default: "5432"}
    PG_DATABASE: {type: string}
    PG_USER: {type: string}
    PG_PASSWORD: {type: string, secret: true}
    PG_SCHEMA: {type: string, default: erp_sales}
    NATS_URL: {type: string}
    OTEL_BASE_URL: {type: string, default: ""}
    AUTHZ_BUNDLE_URL: {type: string}
    IAM_JWKS_URL: {type: string}
    DEFAULT_WAREHOUSE_ID: {type: string}
    EXCEPTION_ASSIGNEE_SUB: {type: string, default: ""}
  required: [PG_HOST, PG_DATABASE, PG_USER, PG_PASSWORD, NATS_URL, AUTHZ_BUNDLE_URL, IAM_JWKS_URL, DEFAULT_WAREHOUSE_ID]

deployment:
  type: container
  build: {context: ., dockerfile: Dockerfile}
  port: 8084
  extraPorts:
    - {name: grpc, port: 9094}
  labels:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
  resources:
    requests: {cpu: 200m, memory: 256Mi}

migration:
  command: [./migrate, up]

healthCheck:
  type: http
  path: /healthz

local:
  language: go
  runCommand: [go, run, ./backend/cmd/server]
