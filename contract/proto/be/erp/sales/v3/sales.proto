// The system surface of erp/sales: the billing source of protocol 05 (the billable ledger of order lines and the
// claims of erp/billing) and the order read. Callers use their service identity; it never filters by a user (a
// component that shows the result to a user trims it by that user's read contract first). Quantities and amounts are
// decimal strings (protocol 14), never floats. The user surface is REST (../../../../../openapi.yaml); the event
// payloads are ../../../../../events/.
syntax = "proto3";

package be.erp.sales.v3;

option go_package = "github.com/brickKit/erp-sales/contract/v3/gen/go/be/erp/sales/v3;salesv3";

// BillingSourceService is the quota owner's side of protocol 05's claim pattern for the billing use: erp/sales decides
// every claim on its order lines under the order's lock, so per line and dimension claimed + billed <= billable.
// Every command is idempotent by claim_id (the user's ID: erp/billing uses the invoice ID).
service BillingSourceService {
  // Ledger answers an order's billable ledger, line by line.
  rpc Ledger(LedgerRequest) returns (LedgerResponse);
  // Claim takes quantities and amounts of one order's lines, all or none (BL01); the same claim_id and content answer
  // the first claim (BL02), other content is a conflict.
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  // Renew extends a pending claim.
  rpc Renew(RenewRequest) returns (RenewResponse);
  // Confirm is sent before numbering: a pending claim becomes confirmed and never expires; an expired one is refused
  // (BL05, BL26); a repeated confirm answers the same (BL24).
  rpc Confirm(ConfirmRequest) returns (ConfirmResponse);
  // Formalize records what was billed (at most the claim, per line); the rest of the claim is released.
  rpc Formalize(FormalizeRequest) returns (FormalizeResponse);
  // Release gives back a pending or confirmed claim (the user voided its draft first).
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  // Reverse returns formalized quantities for a correction (protocol 05); not in this version:
  // CAPABILITY_UNSUPPORTED.
  rpc Reverse(ReverseRequest) returns (ReverseResponse);
}

// OrderService reads orders for other components (erp/billing builds its drafts and print data from it).
service OrderService {
  // Read answers each order ID with its current data (erp.sales_order.changed.v1), at most 500 IDs a call.
  rpc Read(ReadRequest) returns (ReadResponse);
}

// Measure is the two dimensions of a ledger line or a claim line.
message Measure {
  string quantity = 1;
  string amount = 2;
}

message LedgerLine {
  string order_line_id = 1;
  Measure billable = 2;
  Measure claimed = 3;
  Measure billed = 4;
}

message LedgerRequest {
  string order_id = 1;
}

message LedgerResponse {
  string order_id = 1;
  // the order's state: billing needs confirmed or completed
  string order_state = 2;
  repeated LedgerLine lines = 3;
  int64 order_version = 4;
}

message ClaimLine {
  string order_line_id = 1;
  Measure measure = 2;
}

enum ClaimState {
  CLAIM_STATE_UNSPECIFIED = 0;
  CLAIM_STATE_PENDING = 1;
  CLAIM_STATE_CONFIRMED = 2;
  CLAIM_STATE_FORMALIZED = 3;
  CLAIM_STATE_EXPIRED = 4;
  CLAIM_STATE_RELEASED = 5;
}

message Claim {
  string claim_id = 1;
  string order_id = 2;
  ClaimState state = 3;
  repeated ClaimLine lines = 4;
  // formalized: what was billed
  repeated ClaimLine billed = 5;
  // RFC 3339; pending only
  string expires_at = 6;
}

message ClaimRequest {
  string claim_id = 1;
  string order_id = 2;
  repeated ClaimLine lines = 3;
}

// ClaimProblem is why one line could not be claimed.
message ClaimProblem {
  string order_line_id = 1;
  // exceeds_billable, line_not_found, order_not_billable
  string reason = 2;
  Measure remaining = 3;
}

message ClaimResponse {
  // true: claimed (now or by the first call with this claim_id)
  bool claimed = 1;
  Claim claim = 2;
  // not claimed: nothing was taken
  repeated ClaimProblem problems = 3;
}

message RenewRequest {
  string claim_id = 1;
}

message RenewResponse {
  Claim claim = 1;
}

message ConfirmRequest {
  string claim_id = 1;
}

message ConfirmResponse {
  // false: the claim had expired (or was released): the user must not number
  bool confirmed = 1;
  Claim claim = 2;
}

message FormalizeRequest {
  string claim_id = 1;
  // per line, at most the claim; the same lines again are harmless, other lines a conflict
  repeated ClaimLine billed = 2;
}

message FormalizeResponse {
  Claim claim = 1;
}

message ReleaseRequest {
  string claim_id = 1;
}

message ReleaseResponse {
  Claim claim = 1;
}

message ReverseRequest {
  string claim_id = 1;
  // idempotency of the correction
  string correction_id = 2;
  repeated ClaimLine lines = 3;
}

message ReverseResponse {
  Claim claim = 1;
}

message ReadRequest {
  repeated string ids = 1;
}

enum ReadState {
  READ_STATE_UNSPECIFIED = 0;
  READ_STATE_EXISTS = 1;
  READ_STATE_NOT_FOUND = 2;
}

message ReadResult {
  string id = 1;
  ReadState state = 2;
  int64 version = 3;
  // the canonical JSON of the order: the payload of erp.sales_order.changed.v1
  bytes data = 4;
}

message ReadResponse {
  repeated ReadResult results = 1;
}
